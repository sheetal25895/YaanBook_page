<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YaanBook Operator</title>
<style>:root{--bg:#E9EFF5;--p:#F8FAFC;--ink:#10213A;--m:#5B6B82;--l:#C9D6E4;--a:#E8A317}@media(prefers-color-scheme:dark){:root{--bg:#0E1A2C;--p:#152640;--ink:#EAF1FA;--m:#9DB0C9;--l:#28405F}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:0 auto;padding:20px}
h1{margin:0 0 16px}.c{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}
input,button{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--l);background:var(--bg);color:var(--ink)}button{background:var(--ink);color:var(--bg);cursor:pointer;border:0;font-weight:600}
.r{display:grid;grid-template-columns:70px 1.3fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--l)}.r img{width:70px;height:46px;object-fit:cover;border-radius:6px;background:var(--l)}
small{color:var(--m)}pre{white-space:pre-wrap;margin:6px 0 0;font:inherit}@media(max-width:700px){.r{grid-template-columns:1fr 1fr}}</style></head><body><main>
<h1>YaanBook operator</h1><div id="app"></div></main><script>
const app=document.getElementById('app');let T=sessionStorage.getItem('yb');
const api=(u,o={})=>fetch(u,{...o,headers:{...(o.body&&!(o.body instanceof FormData)?{'Content-Type':'application/json'}:{}),Authorization:'Bearer '+T,...o.headers}}).then(async r=>{if(r.status===401){T=null;sessionStorage.removeItem('yb');login();throw 0}return r.json()});
const wa=e=>{const d=String(e.phone).replace(/\D/g,'');return 'https://wa.me/'+(d.length===10?'91'+d:d)+'?text='+encodeURIComponent(`Hello ${e.name}, this is YaanBook about your request ${e.ref} for the ${e.aircraft}.`)};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function login(msg=''){app.innerHTML=`<div class="c"><p>Sign in to manage aircraft and see booking requests.</p><input id="u" placeholder="Username" autocomplete="username"> <input id="p" type="password" placeholder="Password" autocomplete="current-password"> <button id="b">Sign in</button><p id="m">${msg}</p></div>`;
 document.getElementById('b').onclick=async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u.value,pass:p.value})});const j=await r.json();
  if(j.token){T=j.token;sessionStorage.setItem('yb',T);dash()}else document.getElementById('m').textContent=j.error}}
async function dash(){const[f,q]=await Promise.all([api('/api/operator/fleet'),api('/api/operator/enquiries')]);
 app.innerHTML=`<div class="c"><h2>Booking requests (${q.length})</h2>${q.map(e=>`<div class="r" style="grid-template-columns:1fr"><div><b>${E(e.ref)}</b> · ${E(e.aircraft)} · ${E(e.vip)}<br><small>${E(new Date(e.at).toLocaleString())} · ${E(e.name)} · ${E(e.phone)} · email ${E(e.notified?.email)}, WhatsApp ${E(e.notified?.whatsapp)}</small><pre>${E(e.from)} to ${E(e.to)}, ${e.hours} hr, ${E(e.date)||'flexible'}, ${e.pax} pax, ${E(e.estimate)}\n${E(e.notes)}</pre><div style="margin-top:8px"><b>Status: ${E(e.status||'pending')}</b>${e.reason?' ('+E(e.reason)+')':''} <button data-r="${E(e.ref)}" data-s="confirmed">Confirm</button> <button data-r="${E(e.ref)}" data-s="declined" style="background:#C2570C;color:#fff">Decline</button> <a href="${wa(e)}" target="_blank" rel="noopener" style="color:var(--m)">Message client on WhatsApp</a></div></div></div>`).join('')||'<p><small>No requests yet.</small></p>'}</div>
 <div class="c"><h2>Fleet</h2>${f.map(a=>`<div class="r" data-id="${a.id}"><img src="${a.photo||''}" alt=""><b>${E(a.name)}</b><input class="rate" type="number" value="${a.rate}" aria-label="Rate per hour"><input class="at" value="${E(a.at)}" aria-label="Current city"><input class="to" value="${E(a.to||'')}" placeholder="Flying to (optional)" aria-label="Destination"><input class="ic" value="${E(a.reg||a.icao24||'')}" placeholder="DGCA reg VT-XXX (live)" aria-label="DGCA registration mark or ICAO24 hex for live tracking"><span><button class="sv">Save</button> <input class="ph" type="file" accept="image/*" style="width:110px"></span></div>`).join('')}</div>`;
 app.querySelectorAll('button[data-r]').forEach(b=>b.onclick=async()=>{const reason=b.dataset.s==='declined'?(prompt('Reason for declining (optional)')||''):'';await api('/api/operator/enquiries/'+b.dataset.r,{method:'PUT',body:JSON.stringify({status:b.dataset.s,reason})});dash()});
 app.querySelectorAll('.r[data-id]').forEach(r=>{const id=r.dataset.id;r.querySelector('.sv').onclick=async()=>{await api('/api/operator/fleet/'+id,{method:'PUT',body:JSON.stringify({rate:+r.querySelector('.rate').value,at:r.querySelector('.at').value,to:r.querySelector('.to').value,track:r.querySelector('.ic').value.trim()})});
  const ph=r.querySelector('.ph').files[0];if(ph){const fd=new FormData();fd.append('photo',ph);await api(`/api/operator/fleet/${id}/photo`,{method:'POST',body:fd})}dash()}})}
T?dash().catch(()=>{}):login();</script></body></html>
